<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="loadDashboard()">

<div class="header">
  <h2>Dashboard Financeiro</h2>
  <p>Controle suas receitas e despesas</p>
</div>

<div class="card">
  <p>Receitas: R$ <span id="receitas">0.00</span></p>
  <p>Gastos: R$ <span id="gastos">0.00</span></p>
  <p class="balance">
    Saldo: R$ <span id="saldo">0.00</span>
  </p>
</div>

<div class="card">
  <h3>Despesas cadastradas</h3>
  <ul id="lista"></ul>
</div>

<div class="card actions">
  <button class="primary-btn half-btn"
    onclick="window.location.href='add-expense.html'">
    + Gasto
  </button>

  <button class="secondary-btn half-btn"
    onclick="window.location.href='add-income.html'">
    + Receita
  </button>
</div>

<div class="card">
  <button class="primary-btn"
    onclick="window.location.href='reports.html'">
    Ver Relatórios
  </button>
</div>

<script src="app.js"></script>

</body>
</html>
